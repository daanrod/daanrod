<svg xmlns="http://www.w3.org/2000/svg" width="400" height="240" viewBox="0 0 400 240" fill="none" role="img">
  <style>
    .bg { fill: #0d1117; }
    .title { fill: #1f6feb; font: 600 18px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .label { fill: #e6edf3; font: 400 14px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .value { fill: #1f6feb; font: 700 14px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .big { fill: #e6edf3; font: 700 32px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .muted { fill: #8b949e; font: 400 11px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .icon { fill: #1f6feb; }
  </style>
  <rect class="bg" width="400" height="240" rx="10" />
  
    <text x="25" y="40" class="title">Most Used Languages</text>
    <line x1="25" y1="50" x2="375" y2="50" stroke="#1f6feb33" stroke-width="1" />
    <clipPath id="barClip"><rect x="25" y="60" width="350" height="10" rx="5" /></clipPath>
    <g clip-path="url(#barClip)"><rect x="25.00" y="60" width="124.35" height="10" fill="#dea584" /><rect x="149.35" y="60" width="86.90" height="10" fill="#3178c6" /><rect x="236.25" y="60" width="74.45" height="10" fill="#f1e05a" /><rect x="310.69" y="60" width="54.14" height="10" fill="#3572A5" /><rect x="364.84" y="60" width="5.61" height="10" fill="#e34c26" /><rect x="370.45" y="60" width="4.55" height="10" fill="#f34b7d" /></g>
    
    <circle cx="31" cy="101" r="6" fill="#dea584" />
    <text x="45" y="105" class="label">Rust</text>
    <text x="190" y="105" class="muted" text-anchor="end">35.0%</text>
    <circle cx="206" cy="101" r="6" fill="#3178c6" />
    <text x="220" y="105" class="label">TypeScript</text>
    <text x="365" y="105" class="muted" text-anchor="end">24.5%</text>
    <circle cx="31" cy="129" r="6" fill="#f1e05a" />
    <text x="45" y="133" class="label">JavaScript</text>
    <text x="190" y="133" class="muted" text-anchor="end">21.0%</text>
    <circle cx="206" cy="129" r="6" fill="#3572A5" />
    <text x="220" y="133" class="label">Python</text>
    <text x="365" y="133" class="muted" text-anchor="end">15.3%</text>
    <circle cx="31" cy="157" r="6" fill="#e34c26" />
    <text x="45" y="161" class="label">HTML</text>
    <text x="190" y="161" class="muted" text-anchor="end">1.6%</text>
    <circle cx="206" cy="157" r="6" fill="#f34b7d" />
    <text x="220" y="161" class="label">C++</text>
    <text x="365" y="161" class="muted" text-anchor="end">1.3%</text>
  
</svg>