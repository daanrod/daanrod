<svg xmlns="http://www.w3.org/2000/svg" width="400" height="240" viewBox="0 0 400 240" fill="none" role="img">
  <style>
    .bg { fill: #0d1117; }
    .title { fill: #1f6feb; font: 600 18px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .label { fill: #e6edf3; font: 400 14px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .value { fill: #1f6feb; font: 700 14px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .big { fill: #e6edf3; font: 700 32px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .muted { fill: #8b949e; font: 400 11px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .icon { fill: #1f6feb; }
  </style>
  <rect class="bg" width="400" height="240" rx="10" />
  
    <text x="25" y="40" class="title">Danilo Rodrigues's GitHub Stats</text>
    <line x1="25" y1="50" x2="375" y2="50" stroke="#1f6feb33" stroke-width="1" />
    
    <text x="25" y="70" class="label">Total Stars Earned</text>
    <text x="375" y="70" class="value" text-anchor="end">0</text>
    <text x="25" y="92" class="label">Total Commits (all-time)</text>
    <text x="375" y="92" class="value" text-anchor="end">3,216</text>
    <text x="25" y="114" class="label">Total PRs</text>
    <text x="375" y="114" class="value" text-anchor="end">131</text>
    <text x="25" y="136" class="label">Total Issues</text>
    <text x="375" y="136" class="value" text-anchor="end">24</text>
    <text x="25" y="158" class="label">Contributions (last year)</text>
    <text x="375" y="158" class="value" text-anchor="end">2,769</text>
    <text x="25" y="180" class="label">Repositories</text>
    <text x="375" y="180" class="value" text-anchor="end">29</text>
    <text x="25" y="202" class="label">Followers</text>
    <text x="375" y="202" class="value" text-anchor="end">6</text>
  
</svg>