<svg xmlns="http://www.w3.org/2000/svg" width="500" height="195" viewBox="0 0 500 195" fill="none" role="img">
  <style>
    .bg { fill: #0d1117; }
    .title { fill: #1f6feb; font: 600 18px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .label { fill: #e6edf3; font: 400 14px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .value { fill: #1f6feb; font: 700 14px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .big { fill: #e6edf3; font: 700 32px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .muted { fill: #8b949e; font: 400 11px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .icon { fill: #1f6feb; }
  </style>
  <rect class="bg" width="500" height="195" rx="10" />
  
    <text x="250" y="35" class="title" text-anchor="middle">Contribution Activity</text>
    <line x1="25" y1="48" x2="475" y2="48" stroke="#1f6feb33" stroke-width="1" />
    
    <text x="85" y="95" class="big" text-anchor="middle">3,544</text>
    <text x="85" y="125" class="label" text-anchor="middle">Total Contributions</text>
    <text x="85" y="145" class="muted" text-anchor="middle">Jun 22, 2025 – Jun 21, 2026</text>
    <line x1="166" y1="65" x2="166" y2="160" stroke="#8b949e" stroke-width="1" opacity="0.3" />
    <circle cx="250" cy="80" r="22" fill="none" stroke="#f78166" stroke-width="2" />
    <text x="250" y="95" class="big" text-anchor="middle" fill="#f78166">2</text>
    <text x="250" y="125" class="label" text-anchor="middle">Current Streak</text>
    <text x="250" y="145" class="muted" text-anchor="middle">Jun 20, 2026 – Today</text>
    <line x1="334" y1="65" x2="334" y2="160" stroke="#8b949e" stroke-width="1" opacity="0.3" />
    
    <text x="415" y="95" class="big" text-anchor="middle">35</text>
    <text x="415" y="125" class="label" text-anchor="middle">Longest Streak</text>
    <text x="415" y="145" class="muted" text-anchor="middle">Nov 14, 2025 – Dec 18, 2025</text>
  
</svg>